name: Build AJI Multitool
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AJI-MULTITOOL-SERVIS app/main.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AJI-MULTITOOL-SERVIS-Windows
          path: dist/AJI-MULTITOOL-SERVIS.exe
